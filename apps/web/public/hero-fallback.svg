<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1120" preserveAspectRatio="xMidYMid slice" role="presentation">
  <title>wecut brand artwork</title>
  <defs>
    <linearGradient id="wc-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0a"/>
      <stop offset=".5" stop-color="#2d1810"/>
      <stop offset="1" stop-color="#140b07"/>
    </linearGradient>
    <radialGradient id="wc-pink" cx=".82" cy=".2" r=".6">
      <stop offset="0" stop-color="#ff5e8a" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#ff5e8a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff5e8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wc-amber" cx=".15" cy=".88" r=".62">
      <stop offset="0" stop-color="#ffb35c" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#ffb35c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wc-violet" cx=".55" cy=".55" r=".45">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e7a8"/>
      <stop offset=".55" stop-color="#d9b866"/>
      <stop offset="1" stop-color="#b8903f"/>
    </linearGradient>
    <linearGradient id="wc-hot" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5e8a"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <clipPath id="wc-top"><polygon points="0,0 1240,0 1240,420 0,760"/></clipPath>
    <clipPath id="wc-bottom"><polygon points="0,760 1240,420 1240,1120 0,1120"/></clipPath>
    <path id="wc-w" d="M250 330 L440 830 L620 470 L800 830 L990 330" fill="none" stroke="url(#wc-gold)" stroke-width="120" stroke-linecap="round" stroke-linejoin="round"/>
    <filter id="wc-blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1240" height="1120"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1240" height="1120" fill="url(#wc-base)"/>
  <rect width="1240" height="1120" fill="url(#wc-pink)"/>
  <rect width="1240" height="1120" fill="url(#wc-amber)"/>
  <rect width="1240" height="1120" fill="url(#wc-violet)"/>
  <!-- concentric rings, like scissor-handle loops -->
  <g fill="none" stroke="#f7e7a8" stroke-opacity=".14" stroke-width="2">
    <circle cx="1040" cy="180" r="140"/>
    <circle cx="1040" cy="180" r="210"/>
    <circle cx="1040" cy="180" r="290"/>
    <circle cx="170" cy="960" r="120"/>
    <circle cx="170" cy="960" r="190"/>
  </g>
  <text x="620" y="610" text-anchor="middle" font-family="Inter Display, Inter, sans-serif" font-weight="800" font-size="300" letter-spacing="-14" fill="#ff5e8a" opacity=".55" filter="url(#wc-blur)">wecut</text>
  <text x="620" y="610" text-anchor="middle" font-family="Inter Display, Inter, sans-serif" font-weight="800" font-size="300" letter-spacing="-14" fill="url(#wc-gold)">wecut</text>
  <!-- confetti snips -->
  <g stroke-linecap="round" stroke-width="10">
    <line x1="150" y1="200" x2="200" y2="170" stroke="#ff5e8a"/>
    <line x1="300" y1="120" x2="330" y2="160" stroke="#ffd27a"/>
    <line x1="1080" y1="620" x2="1130" y2="600" stroke="#8b5cf6"/>
    <line x1="980" y1="980" x2="1010" y2="1030" stroke="#ff5e8a"/>
    <line x1="560" y1="1010" x2="610" y2="990" stroke="#ffd27a"/>
    <line x1="700" y1="150" x2="740" y2="185" stroke="#8b5cf6"/>
  </g>
</svg>
